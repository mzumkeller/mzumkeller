name: Atualizar card de atividade

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 6h (Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build/**"]

permissions:
  contents: write

jobs:
  atividade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar SVGs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node build/generate.mjs atividade
          else
            node build/generate.mjs
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Atualiza card de atividade" && git push)
